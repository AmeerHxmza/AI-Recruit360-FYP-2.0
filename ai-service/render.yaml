services:
  # ── Web Service: FastAPI + Uvicorn ────────────────────────────────────────
  - type: web
    name: ai-recruit360-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: CV_PASS_THRESHOLD
        value: "70.0"
      - key: ASSESSMENT_PASS_THRESHOLD
        value: "60.0"
      - key: RATE_LIMIT_SCREEN
        value: "20/minute"
      - key: RATE_LIMIT_ASSESSMENT
        value: "30/minute"
      - key: RATE_LIMIT_INTERVIEW
        value: "60/minute"
      - key: RATE_LIMIT_EVALUATION
        value: "10/minute"
      # Secrets — set in Render Dashboard → Environment
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AI_SERVICE_SHARED_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://ai-recruit360.vercel.app,http://localhost:3000"
      - key: RENDER_EXTERNAL_URL
        value: "https://ai-recruit360-fyp.onrender.com"
      - key: ENABLE_KEEP_ALIVE
        value: "true"

  # ── Background Worker: ARQ + Redis Queue ──────────────────────────────────
  - type: worker
    name: ai-recruit360-worker
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m arq app.workers.worker.WorkerSettings
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: CV_PASS_THRESHOLD
        value: "70.0"
      - key: ASSESSMENT_PASS_THRESHOLD
        value: "60.0"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
